name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add upstream
        run: git remote add upstream https://github.com/eoce/transfer-api.git
      - name: Merge upstream
        run: |
          git fetch upstream main
          git merge upstream/main --no-edit
      - name: Push
        run: git push origin main
